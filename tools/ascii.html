<!doctype html>
<html><head><meta charset="utf-8"><title>ascii</title></head>
<body style="margin:0;background:#000">
<canvas id="view" width="420" height="700" style="display:none"></canvas>
<pre id="out" style="color:#0f0;font:9px monospace;line-height:1"></pre>
<script type="module">
import { Track } from '/js/track.js';
import { Car } from '/js/car.js';
import { CFG } from '/js/config.js';
import { Camera, Renderer } from '/js/render.js';
const lines=[];
try {
  const track=new Track(1);
  const car=new Car(); car.reset(track);
  const cam=new Camera();
  const cv=document.getElementById('view');
  const r=new Renderer(cv);
  // advance to a mid-run moment
  for(let i=0;i<8000 && car.grabbed<3;i++){
    const held = car.attached ? car.remaining>0
      : Math.hypot(car.fillet.c.x-car.x,car.fillet.c.y-car.y)<=CFG.grabRange;
    car.step(1/120, held);
  }
  cam.follow(car,0,true);
  r.draw(car,cam,track);
  const W=cv.width, H=cv.height;
  const img=cv.getContext('2d').getImageData(0,0,W,H).data;
  const COLS=56, ROWS=44;
  const ramp=' .:-=+*#%@';
  for(let ry=0; ry<ROWS; ry++){
    let row='';
    for(let rx=0; rx<COLS; rx++){
      // average a block
      let R=0,G=0,B=0,n=0;
      const x0=Math.floor(rx*W/COLS), x1=Math.floor((rx+1)*W/COLS);
      const y0=Math.floor(ry*H/ROWS), y1=Math.floor((ry+1)*H/ROWS);
      for(let y=y0;y<y1;y+=2)for(let x=x0;x<x1;x+=2){
        const i=(y*W+x)*4; R+=img[i];G+=img[i+1];B+=img[i+2];n++;
      }
      R/=n;G/=n;B/=n;
      const lum=(0.2126*R+0.7152*G+0.0722*B)/255;
      const mx=Math.max(R,G,B), mn=Math.min(R,G,B);
      const sat=(mx-mn)/(mx||1);
      let ch=ramp[Math.min(9,Math.floor(lum*9.99))];
      // tint accents
      if(sat>0.35 && B>R && G>R) ch='C';        // cyan pole/road edge
      else if(sat>0.35 && R>150 && G>120 && B<120) ch='Y'; // car yellow
      else if(R<40&&G<45&&B<60) ch=' ';          // dark bg/road
      row+=ch;
    }
    lines.push(row);
  }
  lines.push('');
  lines.push('legend: C=cyan(accent) Y=yellow(car) space=dark #=bright');
  lines.push('car grabbed='+car.grabbed+' attached='+car.attached);
} catch(e){ lines.push('ERROR '+e.message+' '+(e.stack||'')); }
document.getElementById('out').textContent=lines.join('\n');
document.title='ascii-ready';
</script>
</body></html>
