<!doctype html>
<html><head><meta charset="utf-8"><title>pov test</title>
<style>body{margin:0;background:#111;color:#7CFC00;font:12px monospace}
iframe{width:420px;height:700px;border:0}pre{padding:8px}</style></head>
<body>
<iframe id="f" src="/index.html"></iframe>
<pre id="out">running...</pre>
<script>
const log=[]; const say=(s)=>{log.push(s);document.getElementById('out').textContent=log.join('\n');};
const wait=(ms)=>new Promise(r=>setTimeout(r,ms));
window.addEventListener('load', async () => {
  const f=document.getElementById('f'), w=f.contentWindow, d=f.contentDocument;
  await wait(1300);
  try {
    const api=w.__slingdrift, game=api.game;
    const CFG=(await import('/js/config.js?v='+Date.now())).CFG;
    api.startRun(1); await wait(200);
    // Drive a clean line so the frame shows real play (car attached mid-corner).
    const c=game.car; let guard=0;
    while (c.grabbed<2 && guard++<20000) {
      const held = c.attached ? c.remaining>0
        : Math.hypot(c.fillet.c.x-c.x,c.fillet.c.y-c.y)<=CFG.grabRange;
      c.step(1/120, held);
    }
    // advance a little into the swing so the rope is taut and visible
    for (let i=0;i<40 && c.alive;i++) c.step(1/120, c.attached);
    game.camera.follow(c,0,true);
    game.renderer.draw(c, game.camera, game.track);

    const cv=d.getElementById('view'), ctx=cv.getContext('2d');
    const W=cv.width, H=cv.height;
    const img=ctx.getImageData(0,0,W,H).data;
    const at=(x,y)=>{const i=((y|0)*W+(x|0))*4;return [img[i],img[i+1],img[i+2]];};
    const isRoad=(r,g,b)=>{const mx=Math.max(r,g,b),mn=Math.min(r,g,b);return mx-mn<40 && mx>60 && mx<230;};
    const isGrass=(r,g,b)=>g>r+20 && g>b+20;
    const isCyan=(r,g,b)=>b>150 && g>140 && r<160;
    const isYellow=(r,g,b)=>r>190 && g>150 && b<130 && r-b>70;
    const isRope=(r,g,b)=>r>220 && g>215 && b>190 && r>=b;

    // road width at several heights: must narrow toward the horizon
    const rowRoad=(y)=>{let n=0;for(let x=0;x<W;x+=2)if(isRoad(...at(x,y)))n++;return n;};
    const yLow=Math.floor(H*0.90), yMid=Math.floor(H*0.65), yHigh=Math.floor(H*0.45);
    const wLow=rowRoad(yLow), wMid=rowRoad(yMid), wHigh=rowRoad(yHigh);
    say('road px/row  bottom(90%)='+wLow+'  mid(65%)='+wMid+'  upper(45%)='+wHigh);
    say('perspective: bottom wider than upper? '+(wLow>wHigh));

    // sky vs grass split at horizon
    let sky=0;
    for(let x=0;x<W;x+=4){ if(at(x,10)[2]>at(x,10)[1]) sky++; }
    // grass at the left/right verges, sampled down the sides (not the corners)
    let grass=0, probe=0;
    for(const fx of [0.03,0.97]) for(const fy of [0.55,0.7,0.85,0.95]){ probe++; if(isGrass(...at(W*fx,H*fy))) grass++; }
    say('top row blue-ish cols='+sky+'/'+((W/4)|0)+'   grass probes hit='+grass+'/'+probe);

    // cyan pole pixels above the horizon (a pillar rising up)
    let cyan=0, cyanMinY=H;
    for(let y=0;y<H;y++)for(let x=0;x<W;x+=2){ if(isCyan(...at(x,y))){cyan++; if(y<cyanMinY)cyanMinY=y;} }
    say('cyan (next pole) pixels='+cyan+'  topmost y='+cyanMinY+'  horizon~'+((H*0.30)|0));

    // car
    let car=0;
    for(let y=0;y<H;y+=2)for(let x=0;x<W;x+=2) if(isYellow(...at(x,y))) car++;
    say('yellow car pixels='+car+'  attached='+c.attached+'  grabbed='+c.grabbed);

    // rope: near-white pixels strictly between car and pole top
    const px=at(W/2,H*0.62), pt=at(W/2, H*0.30);
    let rope=0;
    for(let y=Math.floor(H*0.30);y<Math.floor(H*0.66);y++)for(let x=0;x<W;x++) if(isRope(...at(x,y))) rope++;
    say('rope-ish pixels in band='+rope);

    const pass = wLow>wHigh && sky>((W/4)|0)*0.6 && grass>=probe*0.6 && cyan>60 && car>40;
    say('RESULT: '+(pass?'PASS':'FAIL'));
  } catch(e){ say('ERROR: '+e.message+'\n'+(e.stack||'')); }
  document.title='done';
});
</script>
</body></html>
