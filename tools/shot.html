<!doctype html><html><head><meta charset="utf-8"><title>shot</title>
<style>body{margin:0;background:#111;color:#7CFC00;font:12px monospace}pre{padding:8px}</style></head>
<body><pre id="out">running...</pre>
<iframe id="f" src="/index.html" style="position:fixed;left:-3000px;top:0;width:420px;height:700px;border:0"></iframe>
<script>
const wait=ms=>new Promise(r=>setTimeout(r,ms));
window.addEventListener('load', async()=>{
  const f=document.getElementById('f'), w=f.contentWindow, d=f.contentDocument;
  await wait(1300);
  const out=document.getElementById('out');
  try{
    const api=w.__slingdrift, game=api.game;
    const {CFG}=await import('/js/config.js?v=9');
    const grab=(c)=>c.attached? c.remaining>0 : Math.hypot(c.fillet.c.x-c.x,c.fillet.c.y-c.y)<=CFG.grabRange;
    const qp=new URLSearchParams(location.search);
    const scene = qp.get('scene') || (location.hash||'#start').slice(1);
    api.startRun(1); await wait(150);
    const c=game.car; let g=0;
    if (scene==='start'){
      // canonical shot: on the opening straight, looking straight down the road
      game.camera.follow(c,0,true);
    } else {
      while(c.grabbed<3 && g++<60000) c.step(1/120, grab(c));
      if (scene==='approach'){ for(let i=0;i<55 && c.alive;i++) c.step(1/120,false); }
      else if (scene==='swing'){ for(let i=0;i<20 && c.alive;i++) c.step(1/120,true); }
      else if (scene==='straight'){ for(let i=0;i<8 && c.alive;i++) c.step(1/120,false); }
      game.camera.follow(c,0,true);
    }
    game.renderer.draw(c, game.camera, game.track);
    const cv=d.getElementById('view');
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));
    const buf=await blob.arrayBuffer();
    await fetch('/__shot?scene='+scene,{method:'POST',body:buf});
    out.textContent='POSTED scene='+scene+' bytes='+buf.byteLength+' attached='+c.attached+' grabbed='+c.grabbed+' dist='+(c.distance/CFG.pxPerMetre).toFixed(1)+'m';
  }catch(e){ out.textContent='ERROR '+e.message+'\n'+(e.stack||''); }
  document.title='done';
});
</script></body></html>
