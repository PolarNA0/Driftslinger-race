<!doctype html>
<html><head><meta charset="utf-8"><title>slingdrift render analysis</title></head>
<body style="margin:0;background:#000">
<canvas id="view" width="420" height="700"></canvas>
<script type="module">
import { Track } from '/js/track.js';
import { Car } from '/js/car.js';
import { CFG } from '/js/config.js';
import { Camera, Renderer } from '/js/render.js';

const near = (a, b, tol) => Math.abs(a[0]-b[0])<tol && Math.abs(a[1]-b[1])<tol && Math.abs(a[2]-b[2])<tol;
const lines = [];
try {
  const track = new Track(1);
  const car = new Car();
  car.reset(track);
  const camera = new Camera();
  const canvas = document.getElementById('view');
  canvas.style.width = '420px'; canvas.style.height = '700px';
  const renderer = new Renderer(canvas);
  for (let i = 0; i < 6000 && car.grabbed < 7; i++) {
    const held = car.attached ? car.remaining > 0
      : Math.hypot(car.fillet.c.x - car.x, car.fillet.c.y - car.y) <= CFG.grabRange;
    car.step(1/120, held);
  }
  camera.follow(car, 0, true);
  renderer.draw(car, camera, track);

  const img = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height).data;
  const colors = { bg:[11,13,18], road:[27,32,48], wall:[46,58,85], pole:[110,231,255], car:[255,209,102] };
  const count = {}; for (const k in colors) count[k] = 0;
  const total = canvas.width * canvas.height;
  for (let i = 0; i < img.length; i += 4) {
    for (const k in colors) if (near([img[i],img[i+1],img[i+2]], colors[k], 26)) { count[k]++; break; }
  }
  lines.push('canvas ' + canvas.width + 'x' + canvas.height);
  for (const k in count) lines.push(k + ' ' + (100*count[k]/total).toFixed(1) + '%');
  const cx = Math.round(canvas.width/2), cy = Math.round(canvas.height/2);
  const idx = (cy*canvas.width + cx)*4;
  const centre = [img[idx], img[idx+1], img[idx+2]];
  lines.push('centre rgb ' + centre.join(','));
  lines.push('car at centre ' + near(centre, colors.car, 90));
  lines.push('road visible ' + (count.road/total > 0.02));
  lines.push('poles visible ' + (count.pole > 0));
  lines.push('corners ' + car.grabbed + ' attached ' + car.attached);
} catch (e) {
  lines.push('ERROR ' + e.message + ' :: ' + (e.stack||'').split('\n')[1]);
}
document.body.innerHTML = '<pre style="color:#0f0;font:14px monospace;padding:12px">' + lines.join('\n') + '</pre>';
document.title = 'RPT ' + lines.join(' | ');
</script>
</body></html>
