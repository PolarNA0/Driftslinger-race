<!doctype html>
<html><head><meta charset="utf-8"><title>offline test</title>
<style>body{margin:0;background:#111;color:#7CFC00;font:12px monospace}iframe{width:420px;height:700px;border:0}pre{padding:8px}</style></head>
<body>
<iframe id="f" src="/index.html"></iframe>
<pre id="out">running...</pre>
<script>
const log=[]; const say=(s)=>{log.push(s);document.getElementById('out').textContent=log.join('\n');};
const wait=(ms)=>new Promise(r=>setTimeout(r,ms));
window.addEventListener('load', async () => {
  try {
    await wait(2500);   // let the page register the SW and precache
    const reg = await navigator.serviceWorker.getRegistration();
    say('service worker registered: '+!!reg);
    if (reg) { await navigator.serviceWorker.ready; say('service worker active: '+reg.active.state); }
    // Read whichever cache the service worker actually opened, rather than
    // hardcoding a version: a hardcoded name silently tests the wrong cache
    // (and reports a false FAIL) every time the SW version is bumped.
    const names = await caches.keys();
    say('caches: '+(names.join(', ')||'none'));
    const name = names.find(n=>n.startsWith('slingdrift-')) || names[0];
    const cache = await caches.open(name);
    say('inspecting cache: '+name);
    const keys = await cache.keys();
    const urls = keys.map(r=>new URL(r.url).pathname).sort();
    say('cached '+urls.length+' files');
    const need = ['/','/index.html','/manifest.webmanifest','/css/style.css','/js/app.js','/js/game.js',
                  '/js/car.js','/js/track.js','/js/render.js','/js/config.js','/js/storage.js','/js/util.js',
                  '/icons/icon-192.png','/icons/icon-512.png','/icons/maskable-512.png','/icons/apple-touch-icon.png'];
    const missing = need.filter(u=>!urls.includes(u));
    say('missing from cache: '+(missing.length?missing.join(', '):'none'));
    // Confirm every cached module is byte-non-empty.
    let empty=0;
    for (const r of keys) { const b = await (await cache.match(r)).blob(); if (b.size===0) empty++; }
    say('empty cached files: '+empty);
    const pass = !!reg && missing.length===0 && empty===0;
    say('RESULT: '+(pass?'PASS':'FAIL'));
  } catch(e){ say('ERROR: '+e.message+'\n'+(e.stack||'')); }
  document.title='done';
});
</script>
</body></html>
