<!doctype html><html><head><meta charset="utf-8"><title>e2e</title>
<style>body{margin:0;background:#0c0e14;color:#8ef58e;font:12px/1.4 monospace}
pre{padding:10px}iframe{position:fixed;left:-3000px;top:0;width:420px;height:700px;border:0}</style>
</head><body><pre id="out">running...</pre>
<iframe id="f" src="/index.html"></iframe>
<script>
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const log=[]; const say=s=>{log.push(s);document.getElementById('out').textContent=log.join('\n');};

async function playOnce(w, d, {mash=false, maxSec=25}={}){
  // real input path: pointerdown on the canvas, pointerup on the window
  const cv=d.getElementById('view');
  const down=()=>cv.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true,cancelable:true}));
  const up=()=>w.dispatchEvent(new w.PointerEvent('pointerup',{bubbles:true}));
  const car=()=>w.__slingdrift.game.car;
  const CFG=(await import('/js/config.js?v=9')).CFG;
  const t0=performance.now(); let held=false, frames=0;
  while (car().alive && performance.now()-t0 < maxSec*1000){
    const c=car();
    const near = Math.hypot(c.fillet.c.x-c.x, c.fillet.c.y-c.y) <= CFG.grabRange;
    let want;
    if (mash) want = frames % 2 === 0;                       // spam the button
    else want = c.attached ? c.remaining > 0.12 : near;       // sane line
    if (want!==held){ want?down():up(); held=want; }
    frames++; await wait(16);
  }
  if (held) up();
  return { dist: w.__slingdrift.game.metres, alive: car().alive, grabbed: car().grabbed };
}

window.addEventListener('load', async()=>{
  const f=document.getElementById('f'), w=f.contentWindow, d=f.contentDocument;
  await wait(1200);
  try{
    // 1) the menu is up and Play starts a run through the real handler
    say('menu visible: '+!d.getElementById('menu').hidden);
    d.getElementById('btn-play').click();
    await wait(300);
    say('after Play -> state='+w.__slingdrift.game.state+' hud='+d.getElementById('hud-dist').textContent);

    // 2) a sane line driven by real pointer events
    const good=await playOnce(w,d,{});
    say('SANE  -> dist='+good.dist.toFixed(1)+'m alive='+good.alive+' corners='+good.grabbed);
    say('dead overlay shown: '+!d.getElementById('over-dead').hidden+' tag='+d.getElementById('dead-tag').textContent);

    // 3) mashing must not beat the sane line
    d.getElementById('btn-again').click(); await wait(250);
    const mash=await playOnce(w,d,{mash:true});
    say('MASH  -> dist='+mash.dist.toFixed(1)+'m alive='+mash.alive+' corners='+mash.grabbed);
    say('mashing is not better: '+(mash.dist <= good.dist + 1e-6));

    // 4) rope is on screen during a grab
    d.getElementById('btn-again').click(); await wait(250);
    const cv=d.getElementById('view');
    cv.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true,cancelable:true}));
    const CFG=(await import('/js/config.js?v=9')).CFG;
    let i=0; while(i++<600 && !w.__slingdrift.game.car.attached) await wait(16);
    await wait(120);
    const img=cv.getContext('2d').getImageData(0,0,cv.width,cv.height).data;
    let rope=0;
    for(let p=0;p<img.length;p+=4){
      const r=img[p],g=img[p+1],b=img[p+2];
      if(r>232&&g>228&&b>210&&Math.abs(r-g)<14) rope++;
    }
    say('attached='+w.__slingdrift.game.car.attached+' rope-ish px='+rope);
    w.dispatchEvent(new w.PointerEvent('pointerup',{bubbles:true}));
  }catch(e){ say('ERROR '+e.message); say(e.stack||''); }
  document.title='done';
});
</script></body></html>
