<!doctype html>
<html><head><meta charset="utf-8"><title>slingdrift browser test</title>
<style>body{margin:0;background:#111;color:#7CFC00;font:12px monospace}iframe{width:420px;height:700px;border:0}pre{padding:8px}</style></head>
<body>
<iframe id="f" src="/index.html"></iframe>
<pre id="out">running...</pre>
<script>
const log=[]; const say=(s)=>{log.push(s);document.getElementById('out').textContent=log.join('\n');};
const wait=(ms)=>new Promise(r=>setTimeout(r,ms));
window.addEventListener('load', async () => {
  const f=document.getElementById('f'), w=f.contentWindow, d=f.contentDocument;
  await wait(1200);
  try {
    const api=w.__slingdrift; const game=api.game;
    say('api: '+!!api+'  canvas: '+d.getElementById('view').width+'x'+d.getElementById('view').height);
    // Start a run on road 1 and drive a clean line through the real game loop.
    api.startRun(1);
    await wait(200);
    say('state after start: '+game.state);
    const CFG = (await import('/js/config.js?v='+Date.now())).CFG;
    // Drive using the game's own car.step, the same way a good player would.
    let corners=0, guard=0;
    while (game.car.alive && corners<60 && guard++<200000) {
      const c=game.car;
      const held = c.attached
        ? c.remaining > 0
        : Math.hypot(c.fillet.c.x-c.x, c.fillet.c.y-c.y) <= CFG.grabRange;
      c.step(1/120, held);
      corners=c.grabbed;
    }
    const cleanCorners=game.car.grabbed;
    const cleanMetres=game.car.distance/CFG.pxPerMetre;
    say('clean line: alive='+game.car.alive+' corners='+cleanCorners+' dist='+cleanMetres.toFixed(0)+'m');
    game.die();
    await wait(300);
    const dead=d.getElementById('over-dead');
    const deadShown=!dead.hidden;
    const deadText=d.getElementById('dead-dist').textContent+' / '+d.getElementById('dead-sub').textContent;
    say('death screen shown: '+deadShown);
    say('death readout: "'+deadText+'"');
    // Now the exploit check through the real game object.
    api.startRun(1); await wait(100);
    let i=0; const c2=game.car;
    while (c2.alive && i++<20000) c2.step(1/120, i%2===0);
    say('mash: alive='+c2.alive+' corners='+c2.grabbed+' dist='+(c2.distance/CFG.pxPerMetre).toFixed(0)+'m');
    // The readout must report the run we actually achieved, not a fixed number.
    const expectReadout = Math.round(cleanMetres)+' m';
    const readoutOk = deadText.startsWith(expectReadout);
    say('readout matches achieved distance ('+expectReadout+'): '+readoutOk);
    const pass = cleanCorners>=60 && deadShown && readoutOk && c2.grabbed<=3;
    say('RESULT: '+(pass?'PASS':'FAIL'));
  } catch(e){ say('ERROR: '+e.message+'\n'+e.stack); }
  document.title='done';
});
</script>
</body></html>
