<!DOCTYPE html>
<html lang="en">
        <head>
                <meta charset="utf-8">
                <!-- Fit any device: no pinch-zoom, no accidental scroll, and use the
                     full height including the notch area on phones. -->
                <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
                <meta name="theme-color" content="$GODOT_SPLASH_COLOR">
                <meta name="mobile-web-app-capable" content="yes">
                <meta name="apple-mobile-web-app-capable" content="yes">
                <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
                <title>$GODOT_PROJECT_NAME</title>
                <style>
                        :root {
                                --ink: #eef1ff;
                                --ink-dim: #a3abd6;
                                --accent: #ffc94d;
                                --track: rgba(255, 255, 255, 0.14);
                        }

                        * { box-sizing: border-box; }

                        html, body {
                                margin: 0;
                                padding: 0;
                                width: 100%;
                                height: 100%;
                                /* Fill the dynamic viewport so mobile browser chrome
                                   appearing/disappearing does not resize the game. */
                                height: 100dvh;
                                overflow: hidden;
                                overscroll-behavior: none;
                                background-color: $GODOT_SPLASH_COLOR;
                                color: var(--ink);
                                font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
                                -webkit-text-size-adjust: 100%;
                                -webkit-tap-highlight-color: transparent;
                                touch-action: none;
                                user-select: none;
                                -webkit-user-select: none;
                        }

                        /* The canvas fills the viewport on every device; the engine
                           keeps its own aspect handling (canvas_items + expand), so
                           the game is centred with letterboxing rather than stretched. */
                        #canvas {
                                display: block;
                                position: fixed;
                                inset: 0;
                                width: 100%;
                                height: 100%;
                                outline: none;
                                touch-action: none;
                        }

                        #status {
                                position: fixed;
                                inset: 0;
                                display: flex;
                                flex-direction: column;
                                align-items: center;
                                justify-content: center;
                                gap: 22px;
                                padding: 24px;
                                padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
                                background: radial-gradient(120% 90% at 50% 30%, #1b2140 0%, $GODOT_SPLASH_COLOR 70%);
                                text-align: center;
                                transition: opacity 0.4s ease;
                        }

                        #status[hidden] { display: none; }

                        #status-splash {
                                max-width: min(72vw, 420px);
                                max-height: 40vh;
                                width: auto;
                                height: auto;
                                object-fit: contain;
                                border-radius: 14px;
                                filter: drop-shadow(0 12px 30px rgba(0, 0, 0, 0.45));
                        }

                        #status-splash.show-image--false { display: none; }
                        #status-splash.fullsize--true { width: 100%; height: 100%; object-fit: contain; }
                        #status-splash.use-filter--false { image-rendering: pixelated; }

                        #status-label {
                                font-size: clamp(13px, 3.4vw, 16px);
                                letter-spacing: 0.28em;
                                text-transform: uppercase;
                                color: var(--ink-dim);
                        }

                        #status-bar {
                                width: min(62vw, 320px);
                                height: 8px;
                                border-radius: 999px;
                                background: var(--track);
                                overflow: hidden;
                        }

                        #status-fill {
                                height: 100%;
                                width: 0%;
                                border-radius: 999px;
                                background: linear-gradient(90deg, var(--accent), #ffb01f);
                                transition: width 0.2s ease;
                        }

                        #status-percent {
                                font-variant-numeric: tabular-nums;
                                font-size: clamp(12px, 3vw, 14px);
                                color: var(--accent);
                                min-height: 1em;
                        }

                        #status-notice {
                                display: none;
                                max-width: min(88vw, 560px);
                                background: #2a1620;
                                border: 1px solid #6d2b3a;
                                border-radius: 12px;
                                color: #ffd9d9;
                                font-size: clamp(13px, 3.4vw, 15px);
                                line-height: 1.45;
                                padding: 16px 18px;
                                text-align: left;
                                white-space: pre-wrap;
                                overflow: auto;
                                max-height: 60vh;
                        }
                </style>
                $GODOT_HEAD_INCLUDE
        </head>
        <body>
                <canvas id="canvas">
                        Your browser does not support the canvas tag.
                </canvas>

                <noscript>
                        <div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px">
                                This game needs JavaScript enabled to run.
                        </div>
                </noscript>

                <div id="status">
                        <img id="status-splash" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="">
                        <div id="status-label">Loading</div>
                        <div id="status-bar"><div id="status-fill"></div></div>
                        <div id="status-percent"></div>
                        <div id="status-notice"></div>
                </div>

                <script src="$GODOT_URL"></script>
                <script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
        const statusOverlay = document.getElementById('status');
        const statusLabel = document.getElementById('status-label');
        const statusFill = document.getElementById('status-fill');
        const statusPercent = document.getElementById('status-percent');
        const statusNotice = document.getElementById('status-notice');

        let initializing = true;
        let statusMode = '';

        // Stop the phone from scrolling the page behind the game, or from the
        // long-press context menu interrupting play. The canvas keeps its own
        // touch handling, so this only suppresses the browser's page gestures.
        for (const ev of ['contextmenu', 'gesturestart', 'gesturechange', 'gestureend']) {
                window.addEventListener(ev, (e) => e.preventDefault(), { passive: false });
        }

        function setStatusMode(mode) {
                if (statusMode === mode || !initializing) {
                        return;
                }
                if (mode === 'hidden') {
                        statusOverlay.style.opacity = '0';
                        setTimeout(() => statusOverlay.remove(), 400);
                        initializing = false;
                        return;
                }
                statusOverlay.hidden = false;
                const progress = mode === 'progress';
                statusLabel.style.display = progress ? 'block' : 'none';
                document.getElementById('status-bar').style.display = progress ? 'block' : 'none';
                statusPercent.style.display = progress ? 'block' : 'none';
                statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
                statusMode = mode;
        }

        function setStatusNotice(text) {
                statusNotice.textContent = text;
        }

        function displayFailureNotice(err) {
                console.error(err);
                if (err instanceof Error) {
                        setStatusNotice(err.message);
                } else if (typeof err === 'string') {
                        setStatusNotice(err);
                } else {
                        setStatusNotice('An unknown error occurred.');
                }
                setStatusMode('notice');
                initializing = false;
        }

        const missing = Engine.getMissingFeatures({
                threads: GODOT_THREADS_ENABLED,
        });

        if (missing.length !== 0) {
                if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
                        let serviceWorkerRegistrationPromise;
                        try {
                                serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
                        } catch (err) {
                                serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
                        }
                        // There's a chance that installing the service worker would fix the issue
                        Promise.race([
                                serviceWorkerRegistrationPromise.then((registration) => {
                                        if (registration != null) {
                                                return Promise.reject(new Error('Service worker already exists.'));
                                        }
                                        return registration;
                                }).then(() => engine.installServiceWorker()),
                                // For some reason, `getRegistration()` can stall
                                new Promise((resolve) => {
                                        setTimeout(() => resolve(), 2000);
                                }),
                        ]).then(() => {
                                // Reload if there was no error.
                                window.location.reload();
                        }).catch((err) => {
                                console.error('Error while registering service worker:', err);
                        });
                } else {
                        // Display the message as usual
                        const missingMsg = 'This browser is missing features Sling Drift needs:\n\n';
                        displayFailureNotice(missingMsg + missing.join('\n'));
                }
        } else {
                setStatusMode('progress');
                engine.startGame({
                        'onProgress': function (current, total) {
                                if (current > 0 && total > 0) {
                                        const pct = Math.round((current / total) * 100);
                                        statusFill.style.width = pct + '%';
                                        statusPercent.textContent = pct + '%';
                                } else {
                                        // The server did not report a length; show an
                                        // indeterminate sweep instead of a stuck bar.
                                        statusFill.style.width = '100%';
                                        statusFill.style.opacity = '0.4';
                                        statusPercent.textContent = '';
                                }
                        },
                }).then(() => {
                        setStatusMode('hidden');
                }, displayFailureNotice);
        }
}());
                </script>
        </body>
</html>
