name: Verify

# The game and the server share one physics. This workflow is the gate that keeps
# them honest: the JavaScript tests prove the server's verifier, the Godot
# verifiers prove the client players run, and the vendored physics check proves
# the two copies have not drifted.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Deploy workflows call this, so main cannot deploy red.
  workflow_call:

concurrency:
  # Key on the calling workflow as well as the ref: the deploy workflows call
  # this file, and a shared group would let the deploy's call cancel the
  # push-triggered verify (or the other way round).
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  physics:
    name: Physics and server verifier
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Headless physics tests
        run: node tools/test.mjs
      - name: Vendored physics is in step
        run: node tools/sync-physics.mjs --check
      - name: Build version is consistent
        run: node tools/version.mjs --check
      - name: Docs are consistent
        run: node tools/docs-check.mjs
      - name: The toolchain is pinned in one file
        run: node tools/toolchain.mjs --check

  sql:
    name: SQL policies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: The tracker is admin-only
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f supabase/tests/tracker_rls.sql

  godot:
    name: Godot verifiers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Read the toolchain
        run: |
          V="$(node -p "require('./toolchain.json').godot")"
          echo "GODOT_VERSION=$V" >> "$GITHUB_ENV"
          echo "GODOT=/tmp/Godot_v${V}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Install Godot
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/$GODOT_VERSION"
          curl -sSL -o /tmp/godot.zip "$BASE/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x "$GODOT"
          "$GODOT" --version
      - name: Import the project
        run: |
          "$GODOT" --headless --path godot --import
      - name: Run every headless verifier
        run: |
          for script in \
            parity \
            verify_tracks \
            verify_reattach \
            verify_endless \
            verify_board \
            verify_online \
            verify_guard \
            verify_editor \
            verify_ui \
            verify_cars \
            verify_keys \
            verify_audio \
            verify_hud \
            verify_storage
          do
            echo "::group::$script"
            "$GODOT" --headless --path godot --script "res://tools/$script.gd" || exit 1
            echo "::endgroup::"
          done

  web-export:
    name: Web export
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # The export presets can break without a script failing: a missing custom
      # shell, a bad exclude filter, a template that is not installed. Catch it
      # on the PR, not after the deploy job has already published main.
      - name: Read the toolchain
        run: |
          echo "GODOT_VERSION=$(node -p "require('./toolchain.json').godot")" >> "$GITHUB_ENV"
          echo "GODOT_TEMPLATES=$(node -p "require('./toolchain.json').godot_templates")" >> "$GITHUB_ENV"
      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/$GODOT_VERSION"
          curl -sSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -sSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p "$HOME/.local/bin"
          unzip -q godot.zip -d "$HOME/.local/bin"
          mv "$HOME/.local/bin/Godot_v${GODOT_VERSION}_linux.x86_64" "$HOME/.local/bin/godot"
          chmod +x "$HOME/.local/bin/godot"
          TPL_DIR="$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATES"
          mkdir -p "$TPL_DIR"
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$TPL_DIR/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Export the web build
        working-directory: godot
        run: |
          set -euo pipefail
          godot --headless --path . --import
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html
      - name: The export produced a complete build
        working-directory: godot
        run: |
          set -euo pipefail
          test -s build/web/index.html
          test -s build/web/index.pck
          test -s build/web/index.wasm
