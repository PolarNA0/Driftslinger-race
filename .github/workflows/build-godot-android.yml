name: Build Godot Android APK

# Builds the signed debug APK for the Godot port and publishes it to a rolling
# `android-latest` GitHub release, so the web build's /android redirect always
# points at the newest build. The APK is a native Godot build and carries the
# online layer, so it talks to the same Supabase backend as the web build.
on:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/build-godot-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: godot-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships the Android SDK, so accept the licences and install
      # the platform and build-tools the export template needs rather than
      # pulling in a setup action. (android-actions/setup-android@v3 fails on the
      # runner's preinstalled sdkmanager with "Wrong version".)
      - name: Set up the Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # Godot's Android export needs a debug keystore at a path the editor
      # settings point at. keytool ships with the JDK installed above.
      - name: Create a debug keystore
        run: |
          set -euo pipefail
          mkdir -p "$HOME/keystores"
          keytool -genkeypair -v \
            -keystore "$HOME/keystores/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Install Godot 4.5.2 and the export templates
        run: |
          set -euo pipefail
          GODOT_VERSION=4.5.2-stable
          BASE=https://github.com/godotengine/godot/releases/download/$GODOT_VERSION
          curl -sSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -sSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p "$HOME/.local/bin"
          unzip -q godot.zip -d "$HOME/.local/bin"
          mv "$HOME/.local/bin/Godot_v${GODOT_VERSION}_linux.x86_64" "$HOME/.local/bin/godot"
          chmod +x "$HOME/.local/bin/godot"
          TPL_DIR="$HOME/.local/share/godot/export_templates/4.5.2.stable"
          mkdir -p "$TPL_DIR"
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$TPL_DIR/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build the APK
        working-directory: godot
        run: |
          set -euo pipefail
          # Godot reads the Android toolchain paths from the editor settings, so
          # write them for this runner before exporting.
          SETTINGS_DIR="$HOME/.config/godot"
          mkdir -p "$SETTINGS_DIR"
          {
            printf '[gd_resource type="EditorSettings" load_steps=1 format=3]\n\n'
            printf '[resource]\n'
            printf 'export/android/debug_keystore = "%s/keystores/debug.keystore"\n' "$HOME"
            printf 'export/android/debug_keystore_pass = "android"\n'
            printf 'export/android/java_sdk_path = "%s"\n' "$JAVA_HOME"
            printf 'export/android/android_sdk_path = "%s"\n' "$ANDROID_HOME"
          } > "$SETTINGS_DIR/editor_settings-4.5.tres"
          godot --headless --path . --import
          mkdir -p build/android
          godot --headless --path . --export-debug "Android" build/android/drift-slinger.apk

      - uses: actions/upload-artifact@v4
        with:
          name: drift-slinger-apk
          path: godot/build/android/drift-slinger.apk
          if-no-files-found: error

      # Publish to a rolling `android-latest` release so the APK is downloadable
      # from a stable URL (a workflow artifact expires and needs a signed-in
      # browser). The tag is moved to this commit on every build; the APK
      # filename is kept stable so the /android redirect's target never changes.
      - name: Publish the APK to the android-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest \
            godot/build/android/drift-slinger.apk \
            --title "Android (latest)" \
            --notes "Rolling build of the Godot Android app, updated on every push to main that touches godot/. Debug-signed, so it installs over earlier copies." \
            --prerelease
