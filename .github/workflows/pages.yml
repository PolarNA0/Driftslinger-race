name: Deploy to GitHub Pages

# Publishes the game to GitHub Pages. Pages serves files only, so the leaderboard
# API has to live elsewhere: set a repository variable named SLING_API to the API
# host and the deployed copy is pointed at it. Without it the game is still fully
# playable and just keeps its scores on the device.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Builds dist/, the static bundle Pages will serve.
      - run: node tools/build-pages.mjs "${{ vars.SLING_API }}"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
