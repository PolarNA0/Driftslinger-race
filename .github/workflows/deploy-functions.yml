name: Deploy Supabase functions

# Pushes the Edge Functions whenever their source changes, so a backend fix ships
# with the commit that makes it rather than waiting for someone to run the CLI by
# hand. Both functions are deployed: `board` serves the leaderboard, and `run`
# verifies and stores runs and announces records to the Discord tracker. `run`
# used to be left out on the assumption it never changed; when the tracker moved
# server-side it changed, and the omission meant the fix never shipped.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The functions replay runs with the physics vendored into `_shared`, and
      # the copies are only correct if `tools/sync-physics.mjs` was re-run after
      # the last edit to `physics/`. This fails the deploy if they have drifted,
      # so a stale copy can never ship. Node is preinstalled on ubuntu-latest.
      - name: Check the vendored physics is current
        run: node tools/sync-physics.mjs --check

      - name: Read the toolchain
        id: toolchain
        run: echo "supabase_cli=$(node -p "require('./toolchain.json').supabase_cli")" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ steps.toolchain.outputs.supabase_cli }}

      # A management token, from supabase.com/dashboard/account/tokens. It is a
      # repository secret rather than something passed in by hand, because the
      # token is long-lived and a manual step is one that gets forgotten.
      #
      # --yes is required: a hosted change refuses to proceed without it, and CI
      # has no one to answer the prompt. --remote is the current spelling of what
      # used to be --project-ref.
      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy board --remote=pleotpbgzeohxbuxffiq --yes
          supabase functions deploy run   --remote=pleotpbgzeohxbuxffiq --yes

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # A deployed function is not up until both boards answer. The wrong select
      # list on the leaderboard view once 500ed the whole board while the deploy
      # itself was green.
      - name: Both boards answer
        run: node tools/smoke.mjs board
