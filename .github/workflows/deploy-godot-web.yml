name: Deploy Godot web build to Cloudflare

# Publishes the Godot web export to Cloudflare Workers, so a push to main ships a
# playable build at https://driftslinger-race.exopolar1.workers.dev/ with no
# manual step. Only the godot/ tree triggers it; the JavaScript game is untouched.
#
# The Cloudflare Worker is defined by godot/wrangler.toml, which serves
# godot/build/web as static assets.
#
# Requires two repository secrets:
#   CLOUDFLARE_API_TOKEN   - a token with the "Edit Cloudflare Workers" permission
#   CLOUDFLARE_ACCOUNT_ID  - the account id that owns the worker
on:
  push:
    branches: [main]
    paths:
      - 'godot/**'
      - '.github/workflows/deploy-godot-web.yml'
  workflow_dispatch:

concurrency:
  group: godot-web
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The Godot editor is not on the runner, and the web export needs the
      # export templates too, so fetch both from the release that matches the
      # project (see godot/project.godot: 4.5).
      - name: Read the toolchain
        run: |
          echo "GODOT_VERSION=$(node -p "require('./toolchain.json').godot")" >> "$GITHUB_ENV"
          echo "GODOT_TEMPLATES=$(node -p "require('./toolchain.json').godot_templates")" >> "$GITHUB_ENV"
      - name: Install Godot
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot/releases/download/$GODOT_VERSION"
          curl -sSL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -sSL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}_export_templates.tpz"
          mkdir -p "$HOME/.local/bin"
          unzip -q godot.zip -d "$HOME/.local/bin"
          mv "$HOME/.local/bin/Godot_v${GODOT_VERSION}_linux.x86_64" "$HOME/.local/bin/godot"
          chmod +x "$HOME/.local/bin/godot"
          TPL_DIR="$HOME/.local/share/godot/export_templates/$GODOT_TEMPLATES"
          mkdir -p "$TPL_DIR"
          unzip -q templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* "$TPL_DIR/"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Import resources and export the web build
        working-directory: godot
        run: |
          set -euo pipefail
          godot --headless --path . --import
          mkdir -p build/web
          godot --headless --path . --export-release "Web" build/web/index.html

      # Cloudflare caps a static asset at 25 MiB and the exported index.wasm is
      # ~36 MiB, so the deploy is rejected unless the wasm is stored compressed.
      # gzip it to index.wasm.gz and drop the raw file; worker.js serves the
      # original bytes back at /index.wasm (see godot/worker.js).
      - name: Compress the wasm under Cloudflare's 25 MiB asset limit
        working-directory: godot
        run: |
          set -euo pipefail
          gzip -9 -c build/web/index.wasm > build/web/index.wasm.gz
          rm build/web/index.wasm
          ls -la build/web

      # Publish build/web with wrangler. Wrangler reads godot/wrangler.toml, which
      # names the worker `driftslinger-race` and points it at the export output.
      # Pin wrangler 4: the static-assets binding in wrangler.toml is a v4 feature,
      # and the action otherwise installs v3 and the deploy is rejected.
      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: godot
          wranglerVersion: '4'
          command: deploy

  smoke:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # The deploy is only green if the shipped site answers, the wasm is real
      # wasm (not a gzip blob with the wrong header) and /android still redirects.
      - name: The deployed site answers
        run: node tools/smoke.mjs web
