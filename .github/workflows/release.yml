name: Release notes

# A pushed version tag publishes a GitHub release whose body is generated from
# the commits since the previous tag, and names the build version and the
# physics fingerprint the board verifies with. The tag is the release: do not
# create one for a build that has not passed Verify on main.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Build the notes
        run: node tools/release-notes.mjs --out release-notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file release-notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "Sling Drift $GITHUB_REF_NAME" \
              --notes-file release-notes.md
          fi
